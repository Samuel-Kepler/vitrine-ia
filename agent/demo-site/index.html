<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padaria Pão Quente — Site do cliente (demo Aula 2)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <span class="logo">Pão Quente</span>
      <nav>
        <a href="#cardapio">Cardápio</a>
        <a href="#depoimentos">Depoimentos</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Pão fresco todo dia, desde 1998</h1>
        <p class="hero-subtitle">
          Fornadas a cada duas horas, ingredientes da região e encomendas para
          festas e eventos.
        </p>
        <a class="cta" href="#cardapio">Ver cardápio</a>
      </section>

      <section id="cardapio" class="cardapio">
        <h2>Cardápio da semana</h2>
        <ul class="menu-list"></ul>
      </section>
    </main>

    <footer class="site-footer">Feito com carinho — e agora mantido por um agente.</footer>
  </body>
</html>
